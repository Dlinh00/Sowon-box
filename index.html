<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기리고</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:24px;text-align:center}
.cam{flex:1;margin:12px 0;border:1px solid #333;background:#080808;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.2);transform:scaleX(-1)}
input{width:100%;background:#0a0a0a;border:1px solid #444;color:#fff;padding:12px;font-size:15px;outline:none;margin-bottom:8px}
.btn{width:100%;padding:15px;background:#fff;color:#000;border:none;font-size:15px;font-weight:700;letter-spacing:3px}
</style>
</head>
<body>
<div style="font-size:14px;letter-spacing:8px;padding-left:8px">기리고</div>
<div class="cam">
  <video id="v" autoplay playsinline muted></video>
  <div id="msg" style="position:absolute;font-size:12px;color:#777">소원을 입력하고 전송을 누르세요</div>
</div>
<div>
  <input id="n" placeholder="이름 (예: 김서연)">
  <input id="b" inputmode="numeric" placeholder="생년월일 (예: 20080514)">
  <input id="w" placeholder="소원 내용">
  <button class="btn" onclick="go()">소원 전송</button>
</div>
<script>
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{document.getElementById('v').srcObject=s;document.getElementById('msg').style.display='none'}).catch(()=>{});
function go(){
  const n=document.getElementById('n').value.trim(),b=document.getElementById('b').value.trim(),w=document.getElementById('w').value.trim();
  if(!n||!w){alert('이름과 소원을 입력하세요');return;}
  localStorage.setItem('g_meta',b?n+' ('+b+')':n);
  localStorage.setItem('g_wish',w);
  location.href='loading.html';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기리고</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;height:100dvh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:30px 24px;box-sizing:border-box;text-align:center}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;width:100%}
.tmr{font-family:monospace;font-size:44px;letter-spacing:4px}
.box{width:100%;max-width:380px;border-top:1px solid #222;border-bottom:1px solid #222;padding:14px 8px}
</style>
</head>
<body>
<div style="padding-top:10px"><svg width="54" height="54" viewBox="0 0 180 180" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M90 26 C85 26 82 31 81 38 L72 86 L58 108 C54 114 57 121 63 125 L79 133 C84 136 88 133 90 127 Z"/><path d="M90 26 C95 26 98 31 99 38 L108 86 L122 108 C126 114 123 121 117 125 L101 133 C96 136 92 133 90 127 Z"/><path d="M66 127 L57 156 M83 133 L79 158 M114 127 L123 156 M97 133 L101 158"/></svg></div>
<div class="mid">
  <div style="font-size:12px;color:#777;letter-spacing:3px">남은 시간</div>
  <div class="tmr" id="t">24:00:00</div>
  <div class="box">
    <div id="m" style="font-size:12px;color:#888;margin-bottom:6px"></div>
    <div id="w" style="font-size:13px;color:#888"></div>
  </div>
</div>
<a href="index.html" style="font-size:11px;color:#555;text-decoration:none">제한 시간 내에 다른 사람을 초대하지 않으면 대가를 치릅니다.</a>
<script>
document.getElementById('m').innerText=localStorage.getItem('g_meta')||'';
document.getElementById('w').innerText='"'+(localStorage.getItem('g_wish')||'')+'"';
const end=Number(localStorage.getItem('g_end'))||(Date.now()+86400000);
setInterval(()=>{
  const d=Math.max(0,end-Date.now());
  document.getElementById('t').innerText=[Math.floor(d/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)].map(x=>String(x).padStart(2,'0')).join(':');
},1000);
</script>
</body>
</html>
