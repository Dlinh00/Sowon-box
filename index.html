<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>소원 상자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle,#1a0b12 0%,#050505 100%);color:#e6d5b8;font-family:sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.app{width:100%;max-width:400px;height:100%;max-height:750px;padding:30px 24px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;border:1px solid #3a1c24;background:rgba(10,8,10,.85);box-shadow:0 0 40px rgba(139,0,0,.25)}
.symbol{font-size:42px;color:#b8860b;text-shadow:0 0 15px rgba(184,134,11,.6);margin-bottom:10px;transition:transform 2s ease}
.spin{transform:rotate(360deg)}
h1{font-size:22px;letter-spacing:3px;font-weight:400;color:#d4af37}
.counter{margin-top:12px;font-size:13px;color:#9e4747}
.area{display:flex;flex-direction:column;gap:16px}
textarea{width:100%;height:110px;background:rgba(255,255,255,.04);border:1px solid #4a252c;border-radius:8px;padding:14px;color:#f5ebd6;font-size:15px;resize:none;outline:none}
button{background:linear-gradient(135deg,#4a0e17 0%,#240509 100%);color:#e6d5b8;border:1px solid #8b3a3a;padding:15px;border-radius:8px;font-size:16px;letter-spacing:2px}
button:disabled,textarea:disabled{opacity:.4}
.status{min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;line-height:1.5;opacity:0;transition:opacity .8s ease}
.show{opacity:1}
.granted{color:#d4af37;font-weight:bold;font-size:15px}
.warn{color:#c93b3b}
.footer{font-size:11px;color:#5c4b4b}
</style>
</head>
<body>
<div class="app">
  <div style="margin-top:20px">
    <div class="symbol" id="sym">❖</div>
    <h1>소원 상자</h1>
    <div class="counter" id="cnt">남은 소원: 7 / 7</div>
  </div>
  <div class="area">
    <textarea id="inp" placeholder="당신의 소원을 입력하세요...&#10;모든 소원에는 대가가 따릅니다."></textarea>
    <button id="btn" onclick="wish()">소원 빌기</button>
  </div>
  <div class="status" id="st"></div>
  <div class="footer">7번째 소원이 끝나면, 모든 것을 잃게 됩니다.</div>
</div>
<script>
let n=localStorage.getItem('sowon_n')!==null?parseInt(localStorage.getItem('sowon_n')):7;
const w=["곧 현실이 될 것입니다...","주변을 조심하세요.","대가가 이미 시작되었습니다.","돌이킬 수 없습니다.","누군가 당신의 곁을 떠날 것입니다.","마지막 기회가 다가오고 있습니다.","이제 상자가 당신의 영혼을 거둡니다."];
function lock(){document.getElementById('btn').disabled=true;const i=document.getElementById('inp');i.disabled=true;i.placeholder="더 이상 소원을 빌 수 없습니다."}
document.getElementById('cnt').innerText=`남은 소원: ${n} / 7`;
if(n<=0){lock();document.getElementById('st').innerHTML=`<div class="warn">${w[6]}</div>`;document.getElementById('st').classList.add('show')}
function sound(){const c=new(window.AudioContext||window.webkitAudioContext)();[523.25,659.25,783.99,622.25,523.25,493.88].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f,c.currentTime+i*.45);g.gain.setValueAtTime(.15,c.currentTime+i*.45);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.45+1.2);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.45);o.stop(c.currentTime+i*.45+1.3)})}
function wish(){const i=document.getElementById('inp'),s=document.getElementById('st'),m=document.getElementById('sym'),txt=i.value.trim();if(!txt||n<=0)return;sound();m.classList.toggle('spin');const idx=7-n;n--;localStorage.setItem('sowon_n',n);document.getElementById('cnt').innerText=`남은 소원: ${n} / 7`;s.classList.remove('show');setTimeout(()=>{s.innerHTML=`<div class="granted">당신의 소원이 이루어졌습니다:<br>"${txt}"</div><div class="warn">${w[idx]}</div>`;s.classList.add('show');i.value="";if(n===0)lock()},600)}
</script>
</body>
</html>
