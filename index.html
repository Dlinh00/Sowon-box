line-height: 1.5; color: #c93b3b; opacity: 0; transition: opacity 0.8s ease; } .status-box.visible { opacity: 1; } .footer { font-size: 11px; color: #5c4b4b; letter-spacing: 1px; } </style> </head> <body> <div class="app-container"> <div class="header"> <div class="symbol" id="symbol">❖</div> <h1>소원 상자</h1> <div class="counter" id="counter">남은 소원: 7 / 7</div> </div> <div class="wish-area"> <textarea id="wishInput" placeholder="당신의 소원을 입력하세요...&#10;모든 소원에는 대가가 따릅니다."></textarea> <button id="wishBtn" onclick="makeWish()">소원 빌기</button> </div> <div class="status-box" id="statusBox"></div> <div class="footer">7번째 소원이 끝나면, 모든 것을 잃게 됩니다.</div> </div> <script> let wishesLeft = 7; const warnings = [ "첫 번째 소원이 접수되었습니다. 곧 이루어집니다...", "두 번째 소원이 이루어졌습니다. 주변을 조심하세요.", "세 번째 소원. 대가가 이미 시작되었습니다.", "네 번째 소원. 돌이킬 수 없습니다.", "다섯 번째 소원. 누군가 당신의 곁을 떠날 것입니다.", "여섯 번째 소원. 마지막 기회가 다가오고 있습니다.", "일곱 번째 소원 완료. 이제 상자가 당신의 영혼을 거둡니다." ]; function playMusicBox() { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const notes = [523.25, 659.25, 783.99, 622.25, 523.25, 493.88]; notes.forEach((freq, i) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.45); gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.45); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.45 + 1.2); osc.connect(gain); gain.connect(ctx.destination); osc.start(ctx.currentTime + i * 0.45); osc.stop(ctx.currentTime + i * 0.45 + 1.3); }); } function makeWish() { const input = document.getElementById('wishInput'); const statusBox = document.getElementById('statusBox'); const symbol = document.getElementById('symbol'); const btn = document.getElementById('wishBtn'); if (!input.value.trim() || wishesLeft <= 0) return; playMusicBox(); symbol.classList.toggle('spinning'); const index = 7 - wishesLeft; wishesLeft--; document.getElementById('counter').innerText = `남은 소원: ${wishesLeft} / 7`; statusBox.classList.remove('visible'); setTimeout(() => { statusBox.innerText = warnings[index]; statusBox.classList.add('visible'); input.value = ""; if (wishesLeft === 0) { btn.disabled = true; input.disabled = true; input.placeholder = "더 이상 소원을 빌 수 없습니다."; } }, 600); } </script> </body> </html>
