<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>기리고</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:sans-serif;height:100%;overflow:hidden}
.scr{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:30px 24px;text-align:center;max-width:430px;margin:0 auto}
#s1{display:flex;z-index:1}
.scr:target{display:flex;z-index:10}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;width:100%}
.btn{width:100%;padding:16px;background:#fff;color:#000;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:4px;display:block}
.btn2{width:100%;padding:11px;background:#000;color:#777;text-decoration:none;border:1px solid #333;font-size:13px;display:block;margin-top:8px}
.cam{width:100%;flex:1;margin:10px 0;border:1px solid #333;background:#080808;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.2);transform:scaleX(-1)}
input{width:100%;background:#0a0a0a;border:1px solid #444;color:#fff;padding:12px;font-size:15px;outline:none;margin-bottom:8px;border-radius:0}
.tmr{font-family:monospace;font-size:44px;letter-spacing:4px}
.box{width:100%;border-top:1px solid #222;border-bottom:1px solid #222;padding:14px 8px}
</style>
</head>
<body>

<div class="scr" id="s1">
  <div></div>
  <div class="mid">
    <svg width="110" height="110" viewBox="0 0 180 180" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M90 26 C85 26 82 31 81 38 L72 86 L58 108 C54 114 57 121 63 125 L79 133 C84 136 88 133 90 127 Z"/><path d="M90 26 C95 26 98 31 99 38 L108 86 L122 108 C126 114 123 121 117 125 L101 133 C96 136 92 133 90 127 Z"/><path d="M66 127 L57 156 M83 133 L79 158 M114 127 L123 156 M97 133 L101 158"/></svg>
    <div style="font-size:26px;letter-spacing:14px;padding-left:14px;font-weight:300">기리고</div>
  </div>
  <a href="#s2" class="btn" onclick="if(navigator.mediaDevices)navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){document.getElementById('v').srcObject=s;document.getElementById('cm').style.display='none'}).catch(function(){})">소원 빌기</a>
</div>

<div class="scr" id="s2">
  <div style="font-size:14px;letter-spacing:8px;padding-left:8px">기리고</div>
  <div class="cam">
    <video id="v" autoplay playsinline muted></video>
    <div id="cm" style="position:absolute;font-size:12px;color:#777">소원을 입력하고 전송을 누르세요</div>
  </div>
  <div style="width:100%">
    <input id="n" placeholder="이름 (예: 김서연)">
    <input id="b" inputmode="numeric" placeholder="생년월일 (예: 20080514)">
    <input id="w" placeholder="소원 내용">
    <a href="#s3" class="btn" onclick="var n=document.getElementById('n').value.trim(),b=document.getElementById('b').value.trim(),w=document.getElementById('w').value.trim();if(!n||!w){alert('이름과 소원을 입력하세요');return false}var m=b?n+' ('+b+')':n;document.getElementById('m1').innerText=document.getElementById('m2').innerText=m;document.getElementById('w1').innerText=document.getElementById('w2').innerText='&quot;'+w+'&quot;';setTimeout(function(){location.hash='s4'},2500)">소원 전송</a>
    <a href="#s1" class="btn2">취소</a>
  </div>
</div>

<div class="scr" id="s3">
  <div></div>
  <div class="mid">
    <svg width="95" height="95" viewBox="0 0 180 180" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M90 26 C85 26 82 31 81 38 L72 86 L58 108 C54 114 57 121 63 125 L79 133 C84 136 88 133 90 127 Z"/><path d="M90 26 C95 26 98 31 99 38 L108 86 L122 108 C126 114 123 121 117 125 L101 133 C96 136 92 133 90 127 Z"/><path d="M66 127 L57 156 M83 133 L79 158 M114 127 L123 156 M97 133 L101 158"/></svg>
    <div style="font-size:19px;letter-spacing:2px">소원이 전달되고 있습니다...</div>
    <div style="font-size:12px;color:#777">잠시만 기다려 주십시오</div>
  </div>
  <div></div>
</div>

<div class="scr" id="s4">
  <div></div>
  <div class="mid">
    <svg width="64" height="64" viewBox="0 0 180 180" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M90 26 C85 26 82 31 81 38 L72 86 L58 108 C54 114 57 121 63 125 L79 133 C84 136 88 133 90 127 Z"/><path d="M90 26 C95 26 98 31 99 38 L108 86 L122 108 C126 114 123 121 117 125 L101 133 C96 136 92 133 90 127 Z"/><path d="M66 127 L57 156 M83 133 L79 158 M114 127 L123 156 M97 133 L101 158"/></svg>
    <div style="font-size:20px;letter-spacing:2px">소원이 이루어졌습니다.</div>
    <div class="box"><div id="m1" style="font-size:12px;color:#888;margin-bottom:6px"></div><div id="w1" style="font-size:15px"></div></div>
  </div>
  <a href="#s5" class="btn" onclick="var end=Date.now()+86400000;clearInterval(window.iv);window.iv=setInterval(function(){var d=Math.max(0,end-Date.now());document.getElementById('tmr').innerText=[Math.floor(d/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)].map(function(x){return String(x).padStart(2,'0')}).join(':')},1000)">확인</a>
</div>

<div class="scr" id="s5">
  <div style="padding-top:8px"><svg width="54" height="54" viewBox="0 0 180 180" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M90 26 C85 26 82 31 81 38 L72 86 L58 108 C54 114 57 121 63 125 L79 133 C84 136 88 133 90 127 Z"/><path d="M90 26 C95 26 98 31 99 38 L108 86 L122 108 C126 114 123 121 117 125 L101 133 C96 136 92 133 90 127 Z"/><path d="M66 127 L57 156 M83 133 L79 158 M114 127 L123 156 M97 133 L101 158"/></svg></div>
  <div class="mid">
    <div style="font-size:12px;color:#777;letter-spacing:3px">남은 시간</div>
    <div class="tmr" id="tmr">24:00:00</div>
    <div class="box"><div id="m2" style="font-size:12px;color:#888;margin-bottom:6px"></div><div id="w2" style="font-size:13px;color:#888"></div></div>
  </div>
  <a href="#s1" style="font-size:11px;color:#555;text-decoration:none">제한 시간 내에 다른 사람을 초대하지 않으면 대가를 치릅니다.</a>
</div>

</body>
</html>
